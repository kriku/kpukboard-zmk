# According to official instruction:
# Note that CONFIG_BT_MAX_CONN and CONFIG_BT_MAX_PAIRED should be set to the
# same value. On a split keyboard they should only be set for the central and
# must be set to one greater than the desired number of bluetooth profiles.
#
# https://zmk.dev/docs/config/system#bluetooth
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# Prefer the more compatible BLE connection settings. This currently disables
# the 2 Mbit PHY, which can be unreliable with some host Bluetooth chipsets.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Improve both the host and split-half links. The nRF52840 supports +8 dBm and
# ZMK recommends it for unreliable connections; the power cost is negligible.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y


# Enable ZMK as a USB keyboard
#
# https://zmk.dev/docs/config/system
CONFIG_ZMK_USB=y

# Power managment
#
# https://zmk.dev/docs/config/power
#
# Milliseconds of inactivity before entering idle state (default 30000)
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Keep deep sleep disabled. Deep sleep deliberately drops Bluetooth
# connections, which made the keyboard disconnect after 10 minutes of
# inactivity. Normal idle mode remains enabled and keeps Bluetooth connected.
CONFIG_ZMK_SLEEP=n
